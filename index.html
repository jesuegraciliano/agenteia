<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Carga Térmica - NBR 16401</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topo">
      <img src="logo-ifsc.png" alt="Logotipo IFSC" class="logo-ifsc" />
      <div>
        <h1>Calculadora Didática de Carga Térmica</h1>
        <p>Memorial passo a passo baseado em NBR 16401 (modelo simplificado).</p>
      </div>
    </header>

    <section class="painel entrada" aria-label="Parâmetros de entrada">
      <h2>Entradas do ambiente</h2>
      <div class="grid">
        <label>Largura (m)
          <input id="largura" type="number" min="1" step="0.1" value="4" />
        </label>
        <label>Comprimento (m)
          <input id="comprimento" type="number" min="1" step="0.1" value="5" />
        </label>
        <label>Pé-direito (m)
          <input id="peDireito" type="number" min="2" step="0.1" value="2.8" />
        </label>
        <label>Pessoas (un)
          <input id="pessoas" type="number" min="0" step="1" value="2" />
        </label>
        <label>Temperatura interna (°C)
          <input id="tInt" type="number" min="18" max="28" step="0.1" value="24" />
        </label>
        <label>Temperatura externa de projeto (°C)
          <input id="tExt" type="number" min="20" max="45" step="0.1" value="32.2" />
        </label>
        <label>Amplitude térmica diária (°C)
          <input id="amplitude" type="number" min="1" max="20" step="0.1" value="8.5" />
        </label>
        <label>Área de fachada (m²)
          <input id="areaFachada" type="number" min="1" step="0.1" value="14" />
        </label>
        <label>Área de vidro (m²)
          <input id="areaVidro" type="number" min="0" step="0.1" value="3" />
        </label>
        <label>CLTD base (parede)
          <input id="cltdBase" type="number" min="0" step="0.1" value="14" />
        </label>
        <label>SCL vidro
          <input id="sclVidro" type="number" min="0" step="1" value="180" />
        </label>
        <label>SHGC vidro
          <input id="shgc" type="number" min="0.1" max="1" step="0.01" value="0.87" />
        </label>
        <label>U da parede (W/m²K)
          <input id="uParede" type="number" min="0.1" max="5" step="0.01" value="2.44" />
        </label>
        <label>U do vidro (W/m²K)
          <input id="uVidro" type="number" min="0.1" max="8" step="0.1" value="5.8" />
        </label>
        <label>CAH (trocas/h)
          <input id="cah" type="number" min="0" max="5" step="0.1" value="0.5" />
        </label>
        <label>Equip./luz (W/m²)
          <input id="densidadeEquip" type="number" min="0" max="80" step="1" value="20" />
        </label>
      </div>
      <div class="acoes">
        <button id="calcularBtn">Calcular</button>
        <button id="imprimirBtn" class="secundario">Imprimir detalhamento</button>
      </div>
    </section>

    <section class="painel" aria-live="polite">
      <h2>Resultado resumido</h2>
      <div id="resultado" class="resultado">Clique em <strong>Calcular</strong> para gerar o memorial.</div>
    </section>

    <section class="painel" id="memorialSecao">
      <h2>Memorial detalhado (parcela por parcela)</h2>
      <ol id="memorialLista" class="memorial"></ol>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
